<!DOCTYPE html><html><head><meta charset="utf-8"><title>View Audit Logs / Patient Data Access Logs</title></head><body><h1>View Audit Logs / Patient Data Access Logs</h1><p>Bahmni allows an authorised <strong>Admin</strong> user to view the Audit Logs, which store all patient data view, entry, modification details, to understand if a user/provider accessed patient data that they should not have.</p><p>For more details see: <a href="/wiki/spaces/BAH/pages/115906837/Audit+Logs" data-linked-resource-id="115906837" data-linked-resource-version="8" data-linked-resource-type="page">Audit Logs</a> </p></body></html>
